# UIkit breakpoints: https://getuikit.com/docs/visibility
ui_suite_uikit.xs:
  label: "Extra small (phone portrait)"
  mediaQuery: "all and (max-width: 639px)"
  weight: 0
  multipliers:
    - 1x
    - 1.5x
    - 2x

ui_suite_uikit.s:
  label: "Small (@s, phone landscape)"
  mediaQuery: "all and (min-width: 640px)"
  weight: 1
  multipliers:
    - 1x
    - 1.5x
    - 2x

ui_suite_uikit.m:
  label: "Medium (@m, tablet landscape)"
  mediaQuery: "all and (min-width: 960px)"
  weight: 2
  multipliers:
    - 1x
    - 1.5x
    - 2x

ui_suite_uikit.l:
  label: "Large (@l, desktop)"
  mediaQuery: "all and (min-width: 1200px)"
  weight: 3
  multipliers:
    - 1x
    - 1.5x
    - 2x

ui_suite_uikit.xl:
  label: "Extra large (@xl, large screens)"
  mediaQuery: "all and (min-width: 1600px)"
  weight: 4
  multipliers:
    - 1x
    - 1.5x
    - 2x
