# Schema for the configuration files of the UI Suite UIkit theme.
ui_suite_uikit.settings:
  type: theme_settings
  label: "UI Suite UIkit settings"
  mapping:
    uikit_source:
      type: string
      label: "UIkit library source"
    navbar_sticky:
      type: boolean
      label: "Sticky navbar"
    htmx_navigation:
      type: boolean
      label: "HTMX navigation"
    color_mode:
      type: string
      label: "Color mode"
      constraints:
        Choice:
          - auto
          - light
          - dark
    font_family:
      type: string
      label: "Font: atkinson (Atkinson Hyperlegible Next, served by the theme) or system (the fonts of the operating system)"
      constraints:
        Choice:
          - atkinson
          - system
