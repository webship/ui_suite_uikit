# Text card - large. Card with a hover effect and large padding: h2 title, body trimmed to 300 characters, date in the footer.
langcode: en
status: true
dependencies:
  config:
    - core.entity_view_mode.node.text_card_large
    - field.field.node.CONTENT_TYPE_NAME.DESCRIPTION_FIELD_NAME
    - node.type.CONTENT_TYPE_NAME
  module:
    - display_builder
    - text
    - ui_patterns
third_party_settings:
  display_builder:
    profile: default
    sources:
      - source_id: component
        source:
          component:
            component_id: 'ui_suite_uikit:card'
            variant_id: null
            props:
              heading_level:
                source_id: select
                source:
                  value: 2
              hover:
                source_id: checkbox
                source:
                  value: true
              size:
                source_id: select
                source:
                  value: large
            slots:
              title:
                sources:
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:title'
                      'field:node:CONTENT_TYPE_NAME:title':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:title'
                              source:
                                type: string
                                label: hidden
                                settings:
                                  link_to_entity: true
                                third_party_settings: {  }
              content:
                sources:
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                      'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                              source:
                                type: text_summary_or_trimmed
                                label: hidden
                                settings:
                                  trim_length: 300
                                third_party_settings: {  }
              footer:
                sources:
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:created'
                      'field:node:CONTENT_TYPE_NAME:created':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:created'
                              source:
                                type: timestamp
                                label: hidden
                                settings:
                                  date_format: medium
                                  custom_date_format: ''
                                  timezone: ''
                                third_party_settings: {  }
id: node.CONTENT_TYPE_NAME.text_card_large
targetEntityType: node
bundle: CONTENT_TYPE_NAME
mode: text_card_large
content: {  }
hidden: {  }
