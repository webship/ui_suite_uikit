# Hero card. Cover: large image with light content at the bottom left, a medium heading and the trimmed body.
langcode: en
status: true
dependencies:
  config:
    - core.entity_view_mode.node.hero_card
    - field.field.node.CONTENT_TYPE_NAME.DESCRIPTION_FIELD_NAME
    - field.field.node.CONTENT_TYPE_NAME.MEDIA_FIELD_NAME
    - node.type.CONTENT_TYPE_NAME
  module:
    - display_builder
    - image
    - text
    - ui_patterns
third_party_settings:
  display_builder:
    profile: default
    sources:
      - source_id: component
        source:
          component:
            component_id: 'ui_suite_uikit:cover'
            variant_id: null
            props:
              height:
                source_id: select
                source:
                  value: large
              content_position:
                source_id: select
                source:
                  value: 'bottom-left'
              inverse:
                source_id: select
                source:
                  value: light
            slots:
              media:
                sources:
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
                      'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
                              source:
                                type: image
                                label: hidden
                                settings:
                                  image_link: ''
                                  image_style: wide
                                  image_loading:
                                    attribute: lazy
                                third_party_settings: {  }
              content:
                sources:
                  - source_id: component
                    source:
                      component:
                        component_id: 'ui_suite_uikit:heading'
                        variant_id: null
                        props:
                          heading_level:
                            source_id: select
                            source:
                              value: 2
                          size:
                            source_id: select
                            source:
                              value: medium
                        slots:
                          title:
                            sources:
                              - source_id: entity_field
                                source:
                                  derivable_context: 'field:node:CONTENT_TYPE_NAME:title'
                                  'field:node:CONTENT_TYPE_NAME:title':
                                    value:
                                      sources:
                                        - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:title'
                                          source:
                                            type: string
                                            label: hidden
                                            settings:
                                              link_to_entity: true
                                            third_party_settings: {  }
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                      'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                              source:
                                type: text_summary_or_trimmed
                                label: hidden
                                settings:
                                  trim_length: 200
                                third_party_settings: {  }
id: node.CONTENT_TYPE_NAME.hero_card
targetEntityType: node
bundle: CONTENT_TYPE_NAME
mode: hero_card
content: {  }
hidden: {  }
