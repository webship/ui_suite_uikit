# Overlay card - xlarge. Dark overlay at the bottom of the image: h2 heading, body trimmed to 150 characters.
langcode: en
status: true
dependencies:
  config:
    - core.entity_view_mode.node.overlay_card_xlarge
    - field.field.node.CONTENT_TYPE_NAME.DESCRIPTION_FIELD_NAME
    - field.field.node.CONTENT_TYPE_NAME.MEDIA_FIELD_NAME
    - node.type.CONTENT_TYPE_NAME
  module:
    - display_builder
    - image
    - text
    - ui_patterns
third_party_settings:
  display_builder:
    profile: default
    sources:
      - source_id: component
        source:
          component:
            component_id: 'ui_suite_uikit:overlay'
            variant_id:
              source_id: select
              source:
                value: primary
            props:
              position:
                source_id: select
                source:
                  value: bottom
            slots:
              media:
                sources:
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
                      'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
                              source:
                                type: image
                                label: hidden
                                settings:
                                  image_link: content
                                  image_style: wide
                                  image_loading:
                                    attribute: lazy
                                third_party_settings: {  }
              content:
                sources:
                  - source_id: component
                    source:
                      component:
                        component_id: 'ui_suite_uikit:heading'
                        variant_id: null
                        props:
                          heading_level:
                            source_id: select
                            source:
                              value: 2
                        slots:
                          title:
                            sources:
                              - source_id: entity_field
                                source:
                                  derivable_context: 'field:node:CONTENT_TYPE_NAME:title'
                                  'field:node:CONTENT_TYPE_NAME:title':
                                    value:
                                      sources:
                                        - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:title'
                                          source:
                                            type: string
                                            label: hidden
                                            settings:
                                              link_to_entity: true
                                            third_party_settings: {  }
                  - source_id: entity_field
                    source:
                      derivable_context: 'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                      'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME':
                        value:
                          sources:
                            - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                              source:
                                type: text_summary_or_trimmed
                                label: hidden
                                settings:
                                  trim_length: 150
                                third_party_settings: {  }
id: node.CONTENT_TYPE_NAME.overlay_card_xlarge
targetEntityType: node
bundle: CONTENT_TYPE_NAME
mode: overlay_card_xlarge
content: {  }
hidden: {  }
