# UIkit design tokens, consumed by assets/css/tokens.css (generated from the
# UIkit CSS by scripts/build-tokens.mjs). Default values are the ones the theme
# applies (assets/css/drupal.css), chosen for WCAG 2.2 AAA: 7:1 for text,
# 3:1 for the borders of the form controls. The ':root[data-theme="dark"]'
# scope is the dark color mode. Check a new value against every background it
# sits on, see the "Accessibility" section of README.md.
#
# The ids carry the theme name: the ids of UI Skins are shared by every theme
# of the site, and another theme (the administration theme, a theme generated
# from this one) declares the UIkit names too. drupal.css maps each one to its
# UIkit name (ui-suite-uikit-global-color to --uk-global-color).

################################################################################
# Text colors.
################################################################################

ui-suite-uikit-global-color:
  category: "Text colors"
  label: "Text color"
  type: "color"
  default_values:
    ":root": "#444444"

ui-suite-uikit-global-emphasis-color:
  category: "Text colors"
  label: "Emphasis color (headings, active items)"
  type: "color"
  default_values:
    ":root": "#333333"
    ':root[data-theme="dark"]': "#ffffff"

ui-suite-uikit-global-muted-color:
