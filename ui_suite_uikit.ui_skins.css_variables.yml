# UIkit design tokens, consumed by assets/css/tokens.css (generated from the
# UIkit CSS by scripts/build-tokens.mjs). Default values are the UIkit ones.

################################################################################
# Text colors.
################################################################################

uk-global-color:
  category: "Text colors"
  label: "Text color"
  type: "color"
  default_values:
    ":root": "#666666"

uk-global-emphasis-color:
  category: "Text colors"
  label: "Emphasis color (headings, active items)"
  type: "color"
  default_values:
    ":root": "#333333"

uk-global-muted-color:
  category: "Text colors"
  label: "Muted color"
  type: "color"
  default_values:
    ":root": "#999999"

uk-global-inverse-color:
  category: "Text colors"
  label: "Inverse color (text on colored backgrounds)"
  type: "color"
  default_values:
    ":root": "#ffffff"

uk-global-link-color:
  category: "Text colors"
  label: "Link color"
  type: "color"
  default_values:
    ":root": "#1e87f0"

uk-global-link-hover-color:
  category: "Text colors"
  label: "Link hover color"
  type: "color"
  default_values:
    ":root": "#0f6ecd"

