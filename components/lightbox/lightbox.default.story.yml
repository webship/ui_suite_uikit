name: "Gallery in a grid"
slots:
  items:
    type: component
    component: "ui_suite_uikit:grid"
    slots:
      items:
        - type: component
          component: "ui_suite_uikit:lightbox_item"
          slots:
            thumbnail:
              type: html_tag
              tag: img
              attributes:
                src: "https://getuikit.com/docs/images/photo.jpg"
                alt: "Photo"
          props:
            url: "https://getuikit.com/docs/images/photo.jpg"
            caption: "Caption 1"
        - type: component
          component: "ui_suite_uikit:lightbox_item"
          slots:
            thumbnail:
              type: html_tag
              tag: img
              attributes:
                src: "https://getuikit.com/docs/images/dark.jpg"
                alt: "Dark"
          props:
            url: "https://getuikit.com/docs/images/dark.jpg"
            caption: "Caption 2"
        - type: component
          component: "ui_suite_uikit:lightbox_item"
          slots:
            thumbnail:
              type: html_tag
              tag: img
              attributes:
                src: "https://getuikit.com/docs/images/light.jpg"
                alt: "Light"
          props:
            url: "https://getuikit.com/docs/images/light.jpg"
            caption: "Caption 3"
    props:
      child_width: 1-3
      gap: small
props:
  animation: fade
