name: Cover
description: "Hero area: an image or a video covering its container, with content on top."
group: Media
links:
  - url: "https://getuikit.com/docs/cover"
    title: "UIkit Cover documentation"
slots:
  media:
    title: "Image or video"
    description: "The image or video that fills the background."
  content:
    title: Content
    description: "The content placed over the media."
props:
  type: object
  properties:
    height:
      title: Height
      type: string
      enum:
        - small
        - medium
        - large
        - viewport
      "meta:enum":
        small: "Small (150px)"
        medium: "Medium (300px, Default)"
        large: "Large (450px)"
        viewport: "Full viewport"
    content_position:
      title: "Content position"
      type: string
      enum:
        - center
        - top-left
        - top-center
        - top-right
        - center-left
        - center-right
        - bottom-left
        - bottom-center
        - bottom-right
      "meta:enum":
        center: "Center (Default)"
        top-left: "Top left"
        top-center: "Top center"
        top-right: "Top right"
        center-left: "Center left"
        center-right: "Center right"
        bottom-left: "Bottom left"
        bottom-center: "Bottom center"
        bottom-right: "Bottom right"
    inverse:
      title: "Content color"
      type: string
      enum:
        - light
        - dark
      "meta:enum":
        light: "Light (for dark media)"
        dark: "Dark (for light media)"
    overlay:
      title: "Content background"
      description: "A background behind the content, so its text keeps a 7:1 contrast whatever the media (WCAG 1.4.6). Follows the content color when not set."
      type: string
      enum:
        - primary
        - default
        - none
      "meta:enum":
        primary: "Dark (Default with light content)"
        default: "Light (Default with dark content)"
        none: "None: the media must give the contrast"
