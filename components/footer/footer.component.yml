name: Footer
description: "The footer of the site: the contentinfo landmark, as a full-width band with a background, the menus and blocks of the footer, a bottom line like the copyright, and a link back to the top. Place it once, at the end of a page layout."
group: Page
libraryOverrides:
  dependencies:
    - ui_suite_uikit/base
slots:
  content:
    title: Content
    description: "The footer menus and blocks."
  bottom:
    title: "Bottom line"
    description: "A short line under the content, like the copyright or the powered by line."
props:
  type: object
  properties:
    variant:
      title: Background
      description: "The background of the band. secondary: the dark band (the default). muted: a soft tint. default: the page background. primary: the brand color."
      type: string
      enum:
        - secondary
        - muted
        - default
        - primary
      "meta:enum":
        secondary: "Secondary (dark)"
        muted: Muted
        default: Default
        primary: Primary
      default: secondary
    size:
      title: "Vertical padding"
      description: "The space above and under the content."
      type: string
      enum:
        - xsmall
        - small
        - medium
        - large
      "meta:enum":
        xsmall: "X-Small"
        small: Small
        medium: Medium
        large: Large
      default: small
    totop:
      title: "Back to top link"
      description: "Print a link that scrolls back to the top of the page."
      type: boolean
      default: true
